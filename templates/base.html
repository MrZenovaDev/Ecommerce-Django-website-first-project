<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    {% block css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top position-relative">
        <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="navbar-brand" href="{% url 'home' %}">
                {% load static %}
                <img src="{% static 'images/logo.png' %}" width="50" height="40" class="d-inline-block align-text-center">
            </a>
        </li>
        <li class="nav-item dropdown" style="z-index: 9999;">
            <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button" aria-expanded="false">Pages</a>
            <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="{% url 'product_list' %}">Products</a></li>
            <li><a class="dropdown-item" href="{% url 'go_to_cart' %}">Cart</a></li>
            </ul>
        </li>
        {% if user.is_authenticated %}
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <span class="nav-link">Hi {{user.username}}</span>
                <li>
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </li>
            </form>
            <a href="{% url 'profileform' %}" class="btn btn-link text-decoration-none ">
                Profile
            </a>
            <form method="post" action="{% url 'ordereditems' %}">
                {% csrf_token %}
                <li><button type="submit" class="btn btn-link nav-link">Ordered Items</button></li>
            </form>
        {% else %}
            <a href="{% url 'login' %}" class="me-2 text-decoration-none">Login</a>
            <a href="{% url 'signup' %}" class="me-2 text-decoration-none">Sign Up</a>
        {% endif %}
        </ul>
    </nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
{% block content %}
{% endblock %}
</body>
</html>
