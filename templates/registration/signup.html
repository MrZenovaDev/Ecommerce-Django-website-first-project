{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}
{% block content %}
{% load static %}
<style>
body{
    background-image: url('{% static "images/bodyimg.jpg" %}');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
}
</style>

<section class="vh-100">
    <div class="container h-100 ">
        <div class="row d-flex justify-content-center mt-5 h-100 " >
            <div class="col-md-6">
                <div class="card shadow-lg rounded-4 overflow-hidden" style="border:2px rgb(100, 0, 0) solid">
                    <form method="POST" class="mx-1 mx-md-4 mt-4 mb-4">
                        {% csrf_token %}
                        {{form.as_p}}
                        <button type="submit" class="btn btn-primary mt-3">Submit</button>
                    </form>
                    <a href="{% url 'login' %}" class="btn btn-primary">Login?</a>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
{% endblock %}
