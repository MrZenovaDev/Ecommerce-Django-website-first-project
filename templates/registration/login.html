{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="containter">
    <div class="row">
        <form method="post">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">Login</button>
        </form>
        <h5>Haven`t made an account?</h5>
        <a href="{% url 'signup' %}?next={{request.GET.next}}">Sign Up</a>
    </div>
</div>
{% endblock %}
