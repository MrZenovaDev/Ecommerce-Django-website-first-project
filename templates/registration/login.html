{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
{% load static %}
<div class="containter">
    <div class="row">
        <form method="post" id="login_form" nonvalidate>
            {% csrf_token %}
            <p>
                <label for="id_username">Username :</label>
                <input type="text" name="username" autofocus
                autocapitalize="none" autocomplete="username"
                maxlength="150" id="id_username">
            </p>
            <p>
                <label for="id_password">Password :</label>
                <input type="password" name="password" autocomplete=
                urrent-password" id="id_password">
            </p> 
            <p id="error-msg" style="color:red;"></p>
            <button type="submit">Login</button>
        </form>
        <h5>Haven`t made an account?</h5>
        <a href="{% url 'signup' %}?next={{request.GET.next}}">Sign Up</a>
    </div>
</div>
<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
