{% extends 'base.html' %}
{% block title %}Cart{% endblock%}
{% block content %}
{% if cartitems %}
    <button id="BuyAll">Buy all</button>
{% endif %}
<div id="msgBox"></div>
<div class="container mt-4">
    <div class="row row-cols-6 g-6">
        {% for item in cartitems %}
        <a href="/products/{{item.product.id}}" class="text-decoration-none text-dark">
            <div class="card h-100 border-0 bg-light" id="ItemContainer">
                <img src="{{item.product.image.url}}" class="card-img-top" style="height:100px;" >
                <div class="card-body">
                    <h6 class="card-title">{{item.product.title}}</h6>
                    <h7>Qnt:{{item.quantity}}</h7>
                </div>
            </div>
        </a>
        {% empty %}
        <div class="text-center mt-5">
            <p class="text-muted fs-4">🛒 Your cart is empty!</p>
            <a href="{% url 'product_list' %}" class="btn btn-primary">Continue shopping 👜</a>
        </div>
        {% endfor %}
    </div>
</div>
{% load static %}
<script src="{% static 'js/cart.js' %}"></script>
{% endblock %}
